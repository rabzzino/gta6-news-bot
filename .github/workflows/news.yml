name: GTA 6 news
on:
  schedule:
    - cron: "*/30 * * * *"  # GitHub may run it a few minutes late
  workflow_dispatch:
permissions:
  contents: write  # commit seen.json
  issues: write    # open the draft issue
concurrency: news
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen stories" && git push)
